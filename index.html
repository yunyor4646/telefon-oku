<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Telefon Oku">
    <title>Telefon Oku</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: #f0f9ff; height: 100vh; display: flex; flex-direction: column; }
        header { background: #1e40af; color: white; padding: 15px; text-align: center; }
        .container { flex: 1; display: flex; flex-direction: column; padding: 15px; }
        button { padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:active { background: #1d4ed8; }
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        .video-full { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; }
        .video-full.active { display: flex; flex-direction: column; }
        .video-full video { display: block; flex: 1; }
        .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 11; }
        .controls button { width: 50px; height: 50px; padding: 0; border-radius: 50%; }
        .btn-capture { background: #16a34a; color: white; }
        .btn-close { background: #dc2626; color: white; }
        .phones-list { background: white; border-radius: 10px; padding: 10px; flex: 1; overflow-y: auto; margin-top: 10px; display: none; }
        .phones-list.active { display: block; }
        .phone-item { background: #dbeafe; padding: 10px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .phone-num { font-weight: bold; font-size: 16px; }
        .phone-item button { width: 36px; height: 36px; padding: 0; margin: 0 2px; }
    </style>
</head>
<body>
    <header>
        <h1>☎️ Telefon Oku</h1>
    </header>
    <div class="container">
        <button class="btn-primary" id="startBtn">📷 Kamera Başlat</button>
        <div class="phones-list" id="phonesList">
            <h3>Bulunan Numaralar:</h3>
            <div id="phonesContainer"></div>
        </div>
    </div>
    
    <div class="video-full" id="videoFull">
        <video id="video" playsinline autoplay></video>
        <div class="controls">
            <button class="btn-capture" id="captureBtn">📸</button>
            <button class="btn-close" id="closeBtn">✕</button>
        </div>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
    <script>
        const startBtn = document.getElementById('startBtn');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const videoFull = document.getElementById('videoFull');
        const captureBtn = document.getElementById('captureBtn');
        const closeBtn = document.getElementById('closeBtn');
        const phonesList = document.getElementById('phonesList');
        const phonesContainer = document.getElementById('phonesContainer');
        let stream = null;

        window.addEventListener('load', () => {
            setTimeout(startCamera, 500);
        });

        startBtn.addEventListener('click', startCamera);
        captureBtn.addEventListener('click', captureAndRead);
        closeBtn.addEventListener('click', stopCamera);

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
                videoFull.classList.add('active');
            } catch (err) {
                alert('Kamera hatası: ' + err.message);
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
            videoFull.classList.remove('active');
        }

        function processImage(ctx, canvas) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                const gray = r * 0.299 + g * 0.587 + b * 0.114;
                const threshold = 150;
                const bw = gray > threshold ? 255 : 0;
                
                data[i] = bw;
                data[i + 1] = bw;
                data[i + 2] = bw;
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        async function captureAndRead() {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            ctx.drawImage(video, 0, 0);
            processImage(ctx, canvas);

            captureBtn.disabled = true;
            captureBtn.textContent = '⏳';

            try {
                const { data: { text } } = await Tesseract.recognize(canvas, 'eng+tur');
                console.log('OCR Sonuç:', text);
                
                const patterns = [
                    /0?5\d{2}[\s\-]?\d{3}[\s\-]?\d{4}/g,
                    /05\d{9}/g,
                    /5\d{9}/g
                ];
                
                let matches = [];
                for (let pattern of patterns) {
                    matches = matches.concat(text.match(pattern) || []);
                }
                
                const cleaned = matches.map(n => {
                    let num = n.replace(/[\s\-]/g, '');
                    if (num.length === 10 && !num.startsWith('0')) {
                        num = '0' + num;
                    }
                    return num;
                }).filter(n => /^05\d{9}$/.test(n));
                
                const unique = [...new Set(cleaned)];
                
                if (unique.length === 0) {
                    alert('Numara bulunamadı. Lütfen net bir şekilde göster ve tekrar dene.');
                    captureBtn.disabled = false;
                    captureBtn.textContent = '📸';
                } else {
                    displayPhones(unique);
                    stopCamera();
                }
            } catch (err) {
                alert('Hata: ' + err.message);
                captureBtn.disabled = false;
                captureBtn.textContent = '📸';
            }
        }

        function displayPhones(phones) {
            phonesContainer.innerHTML = phones.map(p => `
                <div class="phone-item">
                    <span class="phone-num">${p}</span>
                    <div>
                        <button onclick="copyPhone('${p}')" style="background:#e5e7eb;color:#000;">📋</button>
                        <button onclick="callPhone('${p}')" style="background:#16a34a;color:white;">📞</button>
                    </div>
                </div>
            `).join('');
            phonesList.classList.add('active');
        }

        window.copyPhone = function(phone) {
            navigator.clipboard.writeText(phone);
            alert('Kopyalandı: ' + phone);
        };

        window.callPhone = function(phone) {
            window.location.href = 'tel:' + phone;
        };
    </script>
</body>
</html>
